name: Deploy to Production

on:
  push:
    branches:
      - 1.0.3

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

      - name: Deploy to server
        uses: appleboy/scp-action@master
        with:
          host: ip.fluentconveyors.com
          username: ${{ secrets.AUTH_USER }}
          password: ${{ secrets.AUTH_SECRET }}
          port: 22
          source: dist/*
          target: /home/solequantum-rudra-v2/htdocs/rudra.solequantum.com
          strip_components: 1
          rm: true
